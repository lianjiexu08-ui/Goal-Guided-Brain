name: GGB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ggb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting check
        run: npm run format -- --check

      - name: Source file length gate
        run: npm run quality:lines -- --json

      - name: Git whitespace check
        run: git diff --check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Backend and CLI tests
        run: npm test

      - name: CLI doctor smoke check
        shell: bash
        env:
          DSH_SESSION_DIR: ${{ runner.temp }}/ggb-sessions
        run: |
          node scripts/cli.mjs doctor --json > ggb-doctor.json
          node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('ggb-doctor.json','utf8')); if (!report.ok) { console.error(JSON.stringify(report,null,2)); process.exit(1); }"

      - name: Production build
        run: npm run build

  browser:
    name: Desktop and mobile browser regression
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression
        env:
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: npm run test:e2e

      - name: Build production UI
        run: npm run build

      - name: Run production browser regression
        env:
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: npm run test:e2e:production
