<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: #9ddcf5; font-family: ui-rounded, "PingFang SC", system-ui, sans-serif;
  }
  .scene { width: min(100vw, 1100px); aspect-ratio: 16 / 9; }
  svg { display:block; width:100%; height:100%; border-radius: 28px; box-shadow: 0 24px 70px #397a9560; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.1s linear infinite; }
  .pedal { transform-box: fill-box; transform-origin: 50% 50%; animation: roll 1.1s linear infinite reverse; }
  .leg-a { transform-box: fill-box; transform-origin: 0 0; animation: pedalA 1.1s ease-in-out infinite; }
  .leg-b { transform-box: fill-box; transform-origin: 0 0; animation: pedalB 1.1s ease-in-out infinite; }
  .body-bob { animation: bob .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .wing-flap { transform-box: fill-box; transform-origin: 75% 35%; animation: flap .7s ease-in-out infinite alternate; }
  .cloud { animation: drift 24s linear infinite; }
  .cloud.two { animation-duration: 34s; animation-delay: -12s; }
  .spark { animation: twinkle 1.8s ease-in-out infinite alternate; }
  .spark.s2 { animation-delay: -.6s; }
  @keyframes roll { to { transform: rotate(360deg); } }
  @keyframes pedalA { 0%,100% { transform: rotate(25deg); } 50% { transform: rotate(-28deg); } }
  @keyframes pedalB { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(25deg); } }
  @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  @keyframes flap { to { transform: rotate(10deg); } }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(1200px); } }
  @keyframes twinkle { from { opacity:.3; transform:scale(.7); } to { opacity:1; transform:scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-play-state: paused !important; } }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1100 620" role="img" aria-label="一只戴着红色头盔的鹈鹕骑着蓝色自行车，在海边小路上前进">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8bd8f3"/><stop offset="1" stop-color="#e7f9fb"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#5cc4d6"/><stop offset="1" stop-color="#208fae"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#f7dca4"/><stop offset="1" stop-color="#dbaf70"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <path id="roadline" d="M0 538 Q200 500 400 540 T800 536 T1200 540"/>
  </defs>
  <rect width="1100" height="620" fill="url(#sky)"/>
  <circle cx="870" cy="112" r="58" fill="#fff5a8" opacity=".9"/>
  <g class="cloud" fill="#fff" opacity=".75">
    <path d="M-130 150 q45-56 91 0 q34-30 70 2 q37 2 37 34 h-210q-10-20 12-36z"/>
  </g>
  <g class="cloud two" fill="#fff" opacity=".58">
    <path d="M-160 250 q48-52 92 0 q32-25 68 5 q35 0 35 28 h-206q-8-18 11-33z"/>
  </g>
  <path d="M0 334 Q145 294 284 332 T560 330 T840 334 T1100 326 V470 H0Z" fill="url(#water)"/>
  <path d="M0 370 q100-18 205 0 t210 0 t210 0 t210 0 t265 0" fill="none" stroke="#baf3f0" stroke-width="7" opacity=".7"/>
  <path d="M0 411 Q160 380 320 416 T650 411 T1100 408 V620 H0Z" fill="url(#road)"/>
  <path d="M0 476 Q140 445 284 477 T570 475 T850 478 T1100 474" fill="none" stroke="#fff0c9" stroke-width="5" opacity=".9"/>
  <path d="M0 548 Q150 515 280 546 T560 548 T820 545 T1100 548" fill="none" stroke="#bf8758" stroke-width="4" stroke-dasharray="22 18" opacity=".55"/>
  <ellipse cx="562" cy="505" rx="238" ry="31" fill="#215d70" opacity=".2" filter="url(#shadow)"/>
  <!-- bicycle -->
  <g aria-label="自行车">
    <g class="wheel" fill="none" stroke="#173d55" stroke-width="9">
      <circle cx="425" cy="470" r="76" fill="#d8f3f2" stroke="#173d55"/>
      <path d="M425 394v152M349 470h152M371 416l108 108M479 416L371 524" stroke="#75b8c4" stroke-width="3"/>
    </g>
    <g class="wheel" fill="none" stroke="#173d55" stroke-width="9">
      <circle cx="715" cy="470" r="76" fill="#d8f3f2" stroke="#173d55"/>
      <path d="M715 394v152M639 470h152M661 416l108 108M769 416L661 524" stroke="#75b8c4" stroke-width="3"/>
    </g>
    <path d="M425 470 L515 380 L610 470 L715 470 L585 350 L515 380" fill="none" stroke="#197d9d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M610 470 L585 350 M585 350 L568 325" fill="none" stroke="#173d55" stroke-width="9" stroke-linecap="round"/>
    <path d="M553 326 q32-19 62 0" fill="none" stroke="#173d55" stroke-width="8" stroke-linecap="round"/>
    <path d="M513 380 l-18-25" stroke="#173d55" stroke-width="9" stroke-linecap="round"/>
    <path d="M483 354 h38" stroke="#173d55" stroke-width="10" stroke-linecap="round"/>
    <g class="pedal" fill="none" stroke="#ec8a49" stroke-width="7">
      <circle cx="515" cy="470" r="21"/><path d="M515 449l30-17M515 491l-30 17"/>
    </g>
    <path d="M545 432 l-17-16 M485 508 l-16 17" stroke="#ec8a49" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- pelican -->
  <g class="body-bob" aria-label="鹈鹕">
    <ellipse cx="579" cy="294" rx="91" ry="103" fill="#f5f3e8" stroke="#173d55" stroke-width="7"/>
    <path d="M518 282 q44-77 119-30 q-10 83-66 103 q-34-15-53-73z" fill="#d6e2df" stroke="#173d55" stroke-width="6"/>
    <g class="wing-flap"><path d="M544 285 q61-79 93-21 q-27 76-81 89 q-26-17-12-68z" fill="#eef4ef" stroke="#173d55" stroke-width="7"/><path d="M558 279 q34-29 61-7" fill="none" stroke="#aec8ca" stroke-width="6"/></g>
    <path class="leg-a" d="M550 365 L522 429" fill="none" stroke="#e59a4c" stroke-width="11" stroke-linecap="round"/>
    <path class="leg-b" d="M608 365 L635 427" fill="none" stroke="#e59a4c" stroke-width="11" stroke-linecap="round"/>
    <path d="M515 427 q19 8 34 0 M627 427 q18 9 31 0" fill="none" stroke="#e59a4c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="570" cy="175" r="55" fill="#f5f3e8" stroke="#173d55" stroke-width="7"/>
    <path d="M530 174 q41-58 91-5 q-8 55-50 70 q-35-14-41-65z" fill="#f4c3a1" stroke="#173d55" stroke-width="6"/>
    <path d="M527 180 q-7-31 13-65 q31-24 63 5 q11 24 6 58 q-40-25-82 2z" fill="#e74f54" stroke="#173d55" stroke-width="6"/>
    <path d="M548 137 q24-20 54 0" fill="none" stroke="#ff8b79" stroke-width="8"/>
    <circle cx="584" cy="177" r="7" fill="#173d55"/><circle cx="586" cy="175" r="2.5" fill="#fff"/>
    <path d="M613 189 q53 5 121 35 q-5 24-32 26 l-88-28z" fill="#f3a75f" stroke="#173d55" stroke-width="7"/>
    <path d="M611 215 q46 21 84 14 q-28 25-80 0z" fill="#ef8751"/>
    <path d="M553 225 q-27 14-36 42" fill="none" stroke="#e8a28a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="spark" fill="#fff5a8"><path d="M175 375 l5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/><path d="M945 290 l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/></g>
  <text x="52" y="74" fill="#173d55" font-size="24" font-weight="700" letter-spacing="3">PELICAN RIDE</text>
  <text x="54" y="101" fill="#397a8e" font-size="14" letter-spacing="2">海风正好，出发吧！</text>
</svg>
</div>
</body>
</html>
